name: Host checks

on:
  pull_request:
    branches: [historical]
  push:
    branches: [historical]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test host tools
        run: python -m unittest discover -s tests -v
      - name: Check reference layout
        run: python tools/retroboot_layout.py profiles/rb-8g-chs255.json
