name: HDD BIOS boot

on:
  pull_request:
    branches: [historical]
  push:
    branches: [historical]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hdd-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install host build and emulator packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential qemu-system-x86
      - name: Prepare verified toolchain
        run: make toolchain
      - name: Reproduce HDD images and verify boot/error paths
        run: make hdd-test
      - name: Upload compact HDD fixture and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retroboot-hdd-bios
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          path: |
            build/hdd/retroboot-hdd.img
            build/hdd/*.bin
            build/hdd/*.rom
            build/hdd/*.map
            build/hdd/manifest.json
            build/hdd/boot-results.json
            build/hdd/*.log
            build/hdd/*.trace
            build/hdd/*.conf
