name: HDD BIOS boot

on:
  pull_request:
    branches: [historical, dev, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hdd-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install host build and emulator packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential qemu-system-x86 qemu-utils
      - name: Prepare verified toolchain
        run: make toolchain
      - name: Reproduce HDD images and verify loader, menu, headers, profiles, installation state, visibility, checked profiles, allocation, journal diagnosis and VBR handoff
        run: make hdd-test
      - name: Reproduce German images and verify localized VGA screens
        run: make hdd-ui-test RB_LANGUAGE=de
      - name: Boot independent rescue media after interrupted HDD menu switches
        run: |
          python3 tools/build_rescue.py --language en
          python3 tools/test_profile_switch_recovery.py
          python3 tools/build_rescue.py --language de
          python3 tools/test_later_profile_recovery.py
      - name: Upload the prepared DOS disk kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retroboot-dos
          if-no-files-found: error
          retention-days: 30
          path: |
            build/hdd/RetroBoot-DOS.zip
            build/hdd-de/RetroBoot-DOS.zip
            build/hdd/RetroBoot-Countdown-Recovery-EN.zip
            build/hdd-de/RetroBoot-Countdown-Recovery-DE.zip
            build/hdd/RetroBoot-Countdown-Menu-EN.zip
            build/hdd-de/RetroBoot-Countdown-Menue-DE.zip
            build/hdd/RetroBoot-Boot-Hold-EN.zip
            build/hdd-de/RetroBoot-Startsperre-DE.zip
            build/hdd/RetroBoot-Verification-Boot-EN.zip
            build/hdd-de/RetroBoot-Pruefstart-DE.zip
            build/hdd/RetroBoot-DOS-Approval-EN.zip
            build/hdd-de/RetroBoot-DOS-Freigabe-DE.zip
            build/hdd/RetroBoot-Profile-Selection-EN.zip
            build/hdd-de/RetroBoot-Profilauswahl-DE.zip
            build/hdd/RetroBoot-Partition-Switch-EN.zip
            build/hdd-de/RetroBoot-Umschaltung-DE.zip
            build/hdd/RetroBoot-FAT16-FAT32-EN.zip
            build/hdd-de/RetroBoot-FAT16-FAT32-DE.zip
            build/hdd/RetroBoot-Profile-Scope-EN.zip
            build/hdd-de/RetroBoot-Profilschutz-DE.zip
            build/profile-recovery/RetroBoot-Profilwechsel-Rettung.zip
      - name: Upload compact HDD fixture and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retroboot-hdd-bios
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          path: |
            build/hdd/retroboot-hdd.img
            build/hdd/retroboot-handoff.img
            build/hdd/*.bin
            build/hdd/*.rom
            build/hdd/*.map
            build/hdd/manifest.json
            build/hdd/boot-results.json
            build/hdd/*.log
            build/hdd/*.trace
            build/hdd/*.conf
            build/menu/*.json
            build/menu/*.log
            build/menu/*.trace
            build/menu/*.txt
            build/menu/*.bin
            build/menu/*.png
            build/scan/*.json
            build/scan/*.log
            build/scan/*.trace
            build/scan/*.txt
            build/scan/*.bin
            build/scan/*.png
            build/scan/*.conf
            build/volume/*.json
            build/volume/*.log
            build/volume/*.trace
            build/volume/*.txt
            build/volume/*.bin
