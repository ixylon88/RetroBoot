name: HDD BIOS boot

on:
  pull_request:
    branches: [historical]
  push:
    branches: [historical]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hdd-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install host build and emulator packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential qemu-system-x86
      - name: Prepare verified toolchain
        run: make toolchain
      - name: Reproduce HDD images and verify loader, menu, headers, profiles and VBR handoff
        run: make hdd-test
      - name: Reproduce German images and verify localized VGA screens
        run: make hdd-ui-test RB_LANGUAGE=de
      - name: Upload compact HDD fixture and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retroboot-hdd-bios
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          path: |
            build/hdd/retroboot-hdd.img
            build/hdd/retroboot-handoff.img
            build/hdd/*.bin
            build/hdd/*.rom
            build/hdd/*.map
            build/hdd/manifest.json
            build/hdd/boot-results.json
            build/hdd/*.log
            build/hdd/*.trace
            build/hdd/*.conf
            build/menu/*.json
            build/menu/*.log
            build/menu/*.trace
            build/menu/*.txt
            build/menu/*.bin
            build/menu/*.png
            build/scan/*.json
            build/scan/*.log
            build/scan/*.trace
            build/scan/*.txt
            build/scan/*.bin
            build/scan/*.png
            build/scan/*.conf
            build/volume/*.json
            build/volume/*.log
            build/volume/*.trace
            build/volume/*.txt
            build/volume/*.bin
            build/volume/*.png
            build/volume/*.conf
            build/hdd-de/retroboot-hdd.img
            build/hdd-de/retroboot-handoff.img
            build/hdd-de/*.bin
            build/hdd-de/*.rom
            build/hdd-de/*.map
            build/hdd-de/manifest.json
            build/menu-de/*.json
            build/menu-de/*.log
            build/menu-de/*.trace
            build/menu-de/*.txt
            build/menu-de/*.bin
            build/menu-de/*.png
            build/scan-de/*.json
            build/scan-de/*.log
            build/scan-de/*.trace
            build/scan-de/*.txt
            build/scan-de/*.bin
            build/scan-de/*.png
            build/scan-de/*.conf
            build/volume-de/*.json
            build/volume-de/*.log
            build/volume-de/*.trace
            build/volume-de/*.txt
            build/volume-de/*.bin
            build/volume-de/*.png
            build/volume-de/*.conf
            build/handoff/*.json
            build/handoff/*.log
            build/handoff/*.trace
            build/handoff/*.txt
            build/handoff/*.bin
            build/handoff/*.png
            build/handoff/*.conf
            build/handoff-de/*.json
            build/handoff-de/*.log
            build/handoff-de/*.trace
            build/handoff-de/*.txt
            build/handoff-de/*.bin
            build/handoff-de/*.png
            build/handoff-de/*.conf
            build/config/*.json
            build/config/*.log
            build/config/*.trace
            build/config/*.txt
            build/config/*.bin
            build/config/*.png
            build/config/*.conf
            build/config-de/*.json
            build/config-de/*.log
            build/config-de/*.trace
            build/config-de/*.txt
            build/config-de/*.bin
            build/config-de/*.png
            build/config-de/*.conf
