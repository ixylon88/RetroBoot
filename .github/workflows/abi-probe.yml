name: BIOS ABI and Rescue

on:
  pull_request:
    branches: [historical]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bios-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install host build and emulator packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential qemu-system-x86 qemu-utils
      - name: Prepare verified toolchain
        run: make toolchain
      - name: Install pinned ISO packaging dependency
        run: make iso-deps
      - name: Reproduce binaries and boot positive/negative fixtures
        run: make boot-test
      - name: Reproduce and test independent English/German rescue floppies
        run: |
          make rescue-test RB_LANGUAGE=en
          make rescue-test RB_LANGUAGE=de
      - name: Boot the FAT16 and FAT32 format preview from the shipped kit
        run: python3 tools/test_fat_format_plan.py
      - name: Upload the bilingual FAT format preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retroboot-fat-format-plan
          path: build/fat-plan/RetroBoot-Formatvorschau.zip
          if-no-files-found: error
          retention-days: 30
      - name: Check FAT targets and independent backup copies from the shipped kit
        run: python3 tools/test_fat_format_review.py
      - name: Upload the bilingual FAT target review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retroboot-fat-target-review
          path: build/fat-review/RetroBoot-Formatziel.zip
          if-no-files-found: error
          retention-days: 30
      - name: Package and boot the bilingual VirtualBox recovery disk test
        run: |
          python3 tools/package_mbr_recovery.py
          python3 tools/package_backup_disk.py
          python3 tools/package_backup_handoff.py
          python3 -m zipfile -e build/backup-handoff/RetroBoot-MBR-Sicherung.zip "$RUNNER_TEMP/retroboot-mbr-backup"
      - name: Upload the bilingual MBR backup test kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RetroBoot-MBR-Sicherung
          path: ${{ runner.temp }}/retroboot-mbr-backup/
          if-no-files-found: error
          retention-days: 30
      - name: Test targeted MBR repair and prepare the VirtualBox kit
        run: |
          python3 tools/package_mbr_restore.py
          python3 -m zipfile -e build/mbr-restore/RetroBoot-Startcode-Reparatur.zip "$RUNNER_TEMP/retroboot-mbr-restore"
      - name: Upload the bilingual MBR repair kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RetroBoot-Startcode-Reparatur
          path: ${{ runner.temp }}/retroboot-mbr-restore/
          if-no-files-found: error
          retention-days: 30
      - name: Test interrupted journal completion and prepare both VirtualBox languages
        run: |
          python3 tools/package_journal_recovery.py
          python3 -m zipfile -e build/journal-recovery/RetroBoot-Partitionswechsel-Reparatur.zip "$RUNNER_TEMP/retroboot-journal-recovery"
      - name: Upload the partition switch recovery kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RetroBoot-Partitionswechsel-Reparatur
          path: ${{ runner.temp }}/retroboot-journal-recovery/
          if-no-files-found: error
          retention-days: 30
      - name: Package and boot English/German rescue CDs
        run: |
          make rescue-iso-test RB_LANGUAGE=en
          make rescue-iso-test RB_LANGUAGE=de
      - name: Upload probe and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retroboot-abi-probe
          if-no-files-found: error
          retention-days: 30
          path: |
            build/abi/abi-probe.img
            build/abi/abi-probe.bin
            build/abi/abi-probe-boot.bin
            build/abi/manifest.json
            build/abi/boot-results.json
            build/abi/*.log
            build/abi/*.map
      - name: Upload rescue floppies and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retroboot-rescue-diagnostics
          if-no-files-found: error
          retention-days: 30
          path: |
            build/rescue/retroboot-rescue-stream*.img
            build/rescue-de/retroboot-rescue-stream*.img
            build/rescue-stream-test*/*
            build/rescue/retroboot-rescue-demo.img
            build/rescue-de/retroboot-rescue-demo.img
            build/rescue/retroboot-rescue.img
            build/rescue-de/retroboot-rescue.img
            build/rescue/backup-plan-model.img
            build/rescue-de/backup-plan-model.img
            build/rescue/backup-encode-model.img
            build/rescue-de/backup-encode-model.img
            build/rescue/backup-payload-model.img
            build/rescue-de/backup-payload-model.img
            build/rescue/backup-stream-model.img
            build/rescue-de/backup-stream-model.img
            build/rescue/mbr-provenance-model.img
            build/rescue-de/mbr-provenance-model.img
            build/rescue/mbr-restart*.img
            build/rescue-de/mbr-restart*.img
            build/mbr-restart-test*/*
            build/rescue/mbr-reserve*.img
            build/rescue-de/mbr-reserve*.img
            build/mbr-reservation-test*/*
            build/rescue/mbr-original*.img
            build/rescue-de/mbr-original*.img
            build/mbr-original-test*/*
            build/rescue/mbr-witness.img
            build/rescue-de/mbr-witness.img
            build/mbr-witness-test*/*
            build/mbr-review-test*/*
            build/backup-disk-test-*/*.json
            build/backup-disk-test-*/*.rbb
            build/backup-disk-kit/*.zip
            build/backup-handoff/*
            build/mbr-restore/results.json
            build/journal-recovery/results.json
            build/rescue/mbr-backup.img
            build/rescue-de/mbr-backup.img
            build/rescue/backup-verify-model.img
            build/rescue-de/backup-verify-model.img
            build/rescue/backup-live-model.img
            build/rescue-de/backup-live-model.img
            build/rescue/retroboot-rescue-target-hdd.img
            build/rescue-de/retroboot-rescue-target-hdd.img
            build/rescue/retroboot-rescue-bad-fsinfo-hdd.img
            build/rescue-de/retroboot-rescue-bad-fsinfo-hdd.img
            build/rescue/retroboot-rescue-bad-reference-hdd.img
            build/rescue-de/retroboot-rescue-bad-reference-hdd.img
            build/rescue/*.bin
            build/rescue-de/*.bin
            build/rescue/*.map
            build/rescue-de/*.map
            build/rescue/*.rom
            build/rescue-de/*.rom
            build/rescue/synthetic-container.rbb
            build/rescue-de/synthetic-container.rbb
            build/rescue/synthetic-boot-areas.rbb
            build/rescue-de/synthetic-boot-areas.rbb
            build/rescue/synthetic-records.rbb
            build/rescue-de/synthetic-records.rbb
            build/rescue/manifest.json
            build/rescue-de/manifest.json
            build/rescue-test/*.json
            build/rescue-test-de/*.json
            build/rescue-test/*.log
            build/rescue-test-de/*.log
            build/rescue-test/*.trace
            build/rescue-test-de/*.trace
            build/rescue-test/*.conf
            build/rescue-test-de/*.conf
            build/rescue-test/*.txt
            build/rescue-test-de/*.txt
            build/rescue-test/*.png
            build/rescue-test-de/*.png
            build/rescue-test*/backup-verify-model-*.rbb
            build/rescue-test/*.bin
            build/rescue-test-de/*.bin
            build/rescue-match-test/*.json
            build/rescue-match-test-de/*.json
            build/rescue-match-test/*.log
            build/rescue-match-test-de/*.log
            build/rescue-match-test/*.trace
            build/rescue-match-test-de/*.trace
            build/rescue-match-test/*.conf
            build/rescue-match-test-de/*.conf
            build/rescue-match-test/*.txt
            build/rescue-match-test-de/*.txt
            build/rescue-match-test/*.png
            build/rescue-match-test-de/*.png
            build/rescue-match-test/*.bin
            build/rescue-match-test-de/*.bin
            build/rescue-plan-test*/*.json
            build/rescue-plan-test*/*.log
            build/rescue-plan-test*/*.trace
            build/rescue-plan-test*/*.conf
            build/rescue-plan-test*/*.txt
            build/rescue-plan-test*/*.png
            build/rescue-plan-test*/*.bin
      - name: Upload rescue CDs and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retroboot-rescue-cd
          if-no-files-found: error
          retention-days: 30
          path: |
            build/rescue-iso/*.iso
            build/rescue-iso/manifest.json
            build/rescue-iso-de/*.iso
            build/rescue-iso-de/manifest.json
            build/rescue-iso-test*/match-results.json
            build/rescue-iso-test*/*.log
            build/rescue-iso-test*/*.trace
            build/rescue-iso-test*/*.conf
            build/rescue-iso-test*/*.txt
            build/rescue-iso-test*/*.png
            build/rescue-iso-test*/*.bin
            build/rescue-plan-iso-test*/*.json
            build/rescue-plan-iso-test*/*.log
            build/rescue-plan-iso-test*/*.trace
            build/rescue-plan-iso-test*/*.conf
            build/rescue-plan-iso-test*/*.txt
            build/rescue-plan-iso-test*/*.png
            build/rescue-plan-iso-test*/*.bin
